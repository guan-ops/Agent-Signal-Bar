version: 2

updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      swift-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      swift-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
